name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build the mod
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Check what was built
        shell: cmd
        run: dir target\x86_64-pc-windows-msvc\release\ChromeInTheLandsBetween.dll
      - name: Assemble the package the loader expects
        shell: pwsh
        run: |
          $stage = "package"
          New-Item -ItemType Directory -Force -Path "$stage/mod/ChromeInTheLandsBetween" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/ChromeInTheLandsBetween.dll" "$stage/mod/ChromeInTheLandsBetween/ChromeInTheLandsBetween.dll"
          Copy-Item "packaging/config_eldenring.toml" "$stage/config_eldenring.toml"
          Copy-Item "packaging/README.md" "$stage/mod/ChromeInTheLandsBetween/README.md"
          $dll = Get-Item "$stage/mod/ChromeInTheLandsBetween/ChromeInTheLandsBetween.dll"
          Write-Host "packaged dll: $($dll.Length) bytes"
          $name = if ($env:GITHUB_REF -like "refs/tags/*") { "ChromeInTheLandsBetween-$($env:GITHUB_REF_NAME).zip" } else { "ChromeInTheLandsBetween.zip" }
          Compress-Archive -Path "$stage/*" -DestinationPath $name -Force
          Get-ChildItem $name | Select-Object Name, Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeInTheLandsBetween-dll
          path: target/x86_64-pc-windows-msvc/release/ChromeInTheLandsBetween.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeInTheLandsBetween-package
          path: ChromeInTheLandsBetween*.zip
          if-no-files-found: error
      - name: Publish the release when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem "ChromeInTheLandsBetween-*.zip").FullName --title "${{ github.ref_name }} - Chrome in the Lands Between" --notes-file packaging/release-notes.md
